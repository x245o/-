
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SwwaqTalabatiAndroid_source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip SwwaqTalabatiAndroid_source.zip -d extracted

      - name: Build APK
        run: |
          cd extracted/SwwaqTalabatiAndroid
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SwwaqTalabati-APK
          path: extracted/SwwaqTalabatiAndroid/app/build/outputs/apk/debug/app-debug.apk
