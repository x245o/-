
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SwwaqTalabatiAndroid_source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q SwwaqTalabatiAndroid_source.zip -d extracted

      - name: Build APK
        run: |
          cd extracted/SwwaqTalabatiAndroid
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SwwaqTalabati-APK
          path: extracted/SwwaqTalabatiAndroid/app/build/outputs/apk/debug/app-debug.apk
